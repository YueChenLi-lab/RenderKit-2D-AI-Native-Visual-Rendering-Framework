name: RenderKit CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run demo
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderkit-validation
          path: |
            artifacts/
            test-results/
            playwright-report/
          if-no-files-found: ignore
